name: PR Quality

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome
        run: pnpm check:ci

      - name: Catalogs
        run: pnpm check:catalogs

      - name: Package exports
        run: pnpm check:exports

      - name: Skills
        run: pnpm check:skills

      - name: Links
        run: pnpm check:links --no-external

      - name: TypeScript
        run: pnpm check:types

      - name: Unused dependencies
        run: pnpm exec knip --dependencies

      - name: Circular dependencies
        run: pnpm check:circular

      - name: Architecture boundaries
        run: pnpm check:architecture

      - name: Unit tests
        run: pnpm test

      - name: Vulnerability audit
        run: pnpm check:security

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout with history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
