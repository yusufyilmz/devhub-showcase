name: Weekly Code Health

on:
  schedule:
    - cron: "17 9 * * 1"
      timezone: Europe/Madrid
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-code-health
  cancel-in-progress: true

jobs:
  analysis:
    if: ${{ github.event.repository.private == false }}
    name: Dependency and Code Health
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.21.0
          cache: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Unused files
        id: unused_files
        continue-on-error: true
        run: pnpm check:unused:files

      - name: Unused dependencies
        id: unused_deps
        continue-on-error: true
        run: pnpm check:unused:deps

      - name: Unused exports
        id: unused_code
        continue-on-error: true
        run: pnpm check:unused:code

      - name: Unused namespaces
        id: unused_namespaces
        continue-on-error: true
        run: pnpm check:unused:namespaces

      - name: Duplicate code
        id: duplicates
        continue-on-error: true
        run: pnpm check:duplicates

      - name: Depcheck
        id: depcheck
        continue-on-error: true
        run: pnpm check:depcheck

      - name: Depcheck workspaces
        id: depcheck_workspaces
        continue-on-error: true
        run: pnpm check:depcheck:workspaces

      - name: UI catalog
        id: ui_catalog
        continue-on-error: true
        run: pnpm check:ui-catalog

      - name: Production vulnerability audit
        id: security_prod
        continue-on-error: true
        run: pnpm check:security:prod

      - name: Outdated dependencies
        continue-on-error: true
        run: pnpm check:outdated

      - name: Unit test coverage
        id: coverage
        continue-on-error: true
        run: pnpm check:coverage

      - name: Fail on actionable findings
        if: always()
        env:
          UNUSED_FILES: ${{ steps.unused_files.outcome }}
          UNUSED_DEPS: ${{ steps.unused_deps.outcome }}
          UNUSED_CODE: ${{ steps.unused_code.outcome }}
          UNUSED_NAMESPACES: ${{ steps.unused_namespaces.outcome }}
          DUPLICATES: ${{ steps.duplicates.outcome }}
          DEPCHECK: ${{ steps.depcheck.outcome }}
          DEPCHECK_WORKSPACES: ${{ steps.depcheck_workspaces.outcome }}
          UI_CATALOG: ${{ steps.ui_catalog.outcome }}
          SECURITY_PROD: ${{ steps.security_prod.outcome }}
          COVERAGE: ${{ steps.coverage.outcome }}
        run: |
          for result in "$UNUSED_FILES" "$UNUSED_DEPS" "$UNUSED_CODE" "$UNUSED_NAMESPACES" "$DUPLICATES" "$DEPCHECK" "$DEPCHECK_WORKSPACES" "$UI_CATALOG" "$SECURITY_PROD" "$COVERAGE"; do
            if [ "$result" != "success" ]; then
              echo "One or more health checks failed"
              exit 1
            fi
          done

  e2e:
    if: ${{ github.event.repository.private == false }}
    name: E2E and Accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.21.0
          cache: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build Studio for browser tests
        run: pnpm build:studio

      - name: Run E2E tests
        run: pnpm test:e2e:studio

  secrets:
    if: ${{ github.event.repository.private == false }}
    name: Full Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
