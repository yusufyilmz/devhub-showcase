name: Weekly Code Health

on:
  schedule:
    - cron: "17 9 * * 1"
      timezone: Europe/Madrid
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-code-health
  cancel-in-progress: false

jobs:
  analysis:
    name: Dependency and Code Health
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0

      - uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Knip - full analysis
        id: knip
        continue-on-error: true
        run: pnpm exec knip

      - name: Duplicate code
        id: duplicates
        continue-on-error: true
        run: pnpm exec jscpd

      - name: Depcheck - root and workspaces
        id: depcheck
        continue-on-error: true
        shell: bash
        run: |
          status=0

          pnpm exec depcheck . --config .depcheckrc \
            || status=1

          for manifest in apps/*/package.json packages/*/package.json tools/*/package.json; do
            [ -f "$manifest" ] || continue
            pnpm exec depcheck "$(dirname "$manifest")" \
              --config .depcheckrc || status=1
          done

          exit "$status"

      - name: Outdated dependencies
        continue-on-error: true
        run: pnpm outdated -r

      - name: Unit test coverage
        id: coverage
        continue-on-error: true
        run: pnpm test:coverage

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-health-reports
          path: |
            reports/
            coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Fail on actionable findings
        if: always()
        env:
          KNIP: ${{ steps.knip.outcome }}
          DUPLICATES: ${{ steps.duplicates.outcome }}
          DEPCHECK: ${{ steps.depcheck.outcome }}
          COVERAGE: ${{ steps.coverage.outcome }}
        run: |
          for result in "$KNIP" "$DUPLICATES" "$DEPCHECK" "$COVERAGE"; do
            if [ "$result" != "success" ]; then
              echo "One or more health checks failed"
              exit 1
            fi
          done

  e2e:
    name: E2E and Accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0

      - uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-playwright-report
          path: |
            apps/my-dev-studio/playwright-report/
            apps/my-dev-studio/test-results/
          if-no-files-found: ignore
          retention-days: 14

  secrets:
    name: Full Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
