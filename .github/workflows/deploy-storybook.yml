name: Deploy Storybook

on:
  push:
    branches: [ main ]
    paths:
      - "apps/storybook-app/**"
      - "packages/**"
      - "tools/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-storybook.yml"
  pull_request:
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

permissions:
  contents: read

# Preview and manual runs replace the previous run for the same ref.
# Main Pages publishes one deployment at a time and is not cancelled mid-publish.
concurrency:
  group: ${{ github.event_name == 'push' && 'storybook-pages' || format('storybook-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  build:
    name: Build Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ (github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}

    env:
      STORYBOOK_DISABLE_TELEMETRY: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm --filter storybook-app build-storybook

      - name: Verify output
        run: |
          test -f apps/storybook-app/storybook-static/index.html
          test -f apps/storybook-app/storybook-static/iframe.html

      - name: Publish Vercel preview
        if: github.event_name == 'pull_request'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_STORYBOOK_PROJECT_ID }}
        run: |
          : "${VERCEL_TOKEN:?Set the VERCEL_TOKEN secret}"
          : "${VERCEL_ORG_ID:?Set the VERCEL_ORG_ID secret}"
          : "${VERCEL_PROJECT_ID:?Set the VERCEL_STORYBOOK_PROJECT_ID variable}"
          preview=$(mktemp -d)
          mkdir -p "$preview/.vercel/output/static"
          cp -R apps/storybook-app/storybook-static/. "$preview/.vercel/output/static/"
          printf '{"version":3}\n' > "$preview/.vercel/output/config.json"
          npx --yes vercel@65.4.0 deploy --cwd "$preview" --prebuilt --environment preview --force --yes --json --token "$VERCEL_TOKEN" > "$preview/deployment.json"
          url=$(node -e '
            const result = require(process.argv[1]);
            const { url, readyState } = result.deployment ?? result;
            if (!url || readyState !== "READY") throw new Error("Vercel did not return a ready preview URL");
            console.log(url);
          ' "$preview/deployment.json")
          printf '[Open Storybook preview](%s)\n' "$url" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/storybook-app/storybook-static
          retention-days: 1

  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
