name: CI / CD

on:
  pull_request:
    branches: [ main ]

  push:
    branches: [ main ]

  workflow_dispatch:
    inputs:
      application:
        description: Application to deploy after verification
        type: choice
        options: [ all, studio, fitness ]
        default: all

permissions:
  contents: read

# Pull requests and manual runs replace an older run of the same ref.
# Pushes to main keep a unique group so a later push cannot cancel a release
# that may only affect the other app.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  # ----------------------------------------
  # Detect affected applications
  # ----------------------------------------
  changes:
    name: Select affected apps
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      studio: ${{ steps.apps.outputs.studio }}
      fitness: ${{ steps.apps.outputs.fitness }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Detect changed applications
        id: apps
        run: node tools/cli/ci/changes.ts

  # ----------------------------------------
  # Code quality, security and build
  # ----------------------------------------
  verify:
    name: Verify
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Static analysis
      - name: Code quality
        run: pnpm check

      - name: Full lint diagnostics on failure
        if: failure()
        run: pnpm exec biome check . --diagnostic-level=error --max-diagnostics=none

      # Dependency and architecture checks
      - name: Circular dependencies
        run: pnpm check:circular

      - name: Architecture boundaries
        run: pnpm check:architecture

      # Security
      - name: Dependency vulnerability audit
        run: pnpm check:security

      # Tests
      - name: Unit tests
        # Node 24 on GitHub runners can abort the threads pool with
        # "Check failed: jit_page.has_value()" (exit 133). Fewer workers
        # keep concurrent V8 isolates inside the runner memory limit.
        run: pnpm exec vitest run --project unit --maxWorkers=2

      # Builds
      - name: Build Storybook
        run: pnpm --filter storybook-app build-storybook

      - name: Build monorepo
        run: pnpm build

  # ----------------------------------------
  # Deploy Studio
  # ----------------------------------------
  deploy-studio:
    name: Deploy Studio
    needs: [ changes, verify ]

    if: ${{ github.event.repository.private == false && github.repository == 'yusufyilmz/devhub-showcase' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.changes.outputs.studio == 'true' }}
    uses: ./.github/workflows/deploy-app.yml

    with:
      application: studio

    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      DEPLOY_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ----------------------------------------
  # Deploy Fitness OS
  # ----------------------------------------
  deploy-fitness:
    name: Deploy Fitness OS
    needs: [ changes, verify ]

    if: ${{ github.event.repository.private == false && github.repository == 'yusufyilmz/devhub-showcase' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.changes.outputs.fitness == 'true' }}
    uses: ./.github/workflows/deploy-app.yml

    with:
      application: fitness

    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      DEPLOY_PROJECT_ID: ${{ vars.VERCEL_FITNESS_PROJECT_ID }}
