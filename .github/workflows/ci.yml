name: CI / CD

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      application:
        description: Application to deploy after verification
        type: choice
        options: [ all, studio, fitness ]
        default: all

permissions:
  contents: read

# PR updates replace obsolete verification. Every main push keeps its change
# selection; cancelling an unrelated push could otherwise miss an app release.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select affected apps
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      studio: ${{ steps.apps.outputs.studio }}
      fitness: ${{ steps.apps.outputs.fitness }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - id: apps
        run: node tools/cli/ci/changes.ts

  verify:
    name: Verify
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Full lint diagnostics on failure
        if: failure()
        run: pnpm exec biome check . --diagnostic-level=error --max-diagnostics=none
      - run: pnpm test
      - name: Build Storybook
        run: pnpm --filter storybook-app build-storybook
      - run: pnpm build

  deploy-studio:
    name: Deploy Studio
    needs: [ changes, verify ]
    if: ${{ github.event.repository.private == false && github.repository == 'yusufyilmz/devhub-showcase' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.changes.outputs.studio == 'true' }}
    uses: ./.github/workflows/deploy-app.yml
    with:
      application: studio
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      DEPLOY_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-fitness:
    name: Deploy Fitness OS
    needs: [ changes, verify ]
    if: ${{ github.event.repository.private == false && github.repository == 'yusufyilmz/devhub-showcase' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.changes.outputs.fitness == 'true' }}
    uses: ./.github/workflows/deploy-app.yml
    with:
      application: fitness
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      DEPLOY_PROJECT_ID: ${{ vars.VERCEL_FITNESS_PROJECT_ID }}
