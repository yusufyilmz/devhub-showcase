packages:
  - apps/*
  - packages/*
  - tools/*

overrides:
  parse5: ^8.1.1
  parse5-parser-stream: ^8.1.1
  re2js: ">=2.8.7"
  picomatch: ">=4.0.7 <5"

allowBuilds:
  "@parcel/watcher": true
  esbuild: true

# picomatch 4.0.7 is the newest release and GHSA-fc5q-39xc-vjpf still lists it
# as affected, with no patched version. The override above already pins 4.0.7.
# Remove this entry when a fixed release is published.
audit:
  ignore:
    - GHSA-fc5q-39xc-vjpf

minimumReleaseAgeExclude:
  - axios@1.21.0
  - openai@7.45.1

